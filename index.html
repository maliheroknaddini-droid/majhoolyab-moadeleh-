  const up=ev=>{
   removeEventListener("pointermove",mv);removeEventListener("pointerup",up);removeEventListener("pointercancel",up);
   let best=null,bd=44;
   L.querySelectorAll(".slot").forEach(z=>{let b=z.getBoundingClientRect(),d=Math.hypot(Math.max(b.left-ev.clientX,0,ev.clientX-b.right),Math.max(b.top-ev.clientY,0,ev.clientY-b.bottom));if(d<bd){bd=d;best=z}});
